<head>

</head>
<body>
  <main>
    <article class="profile-card">
      <img src="IMG-20261127-WA0104(1).jpg" alt="FSCSS Thumbnail" />
      <h1>FSCSS</h1>
      <h3>Figured Shorthand Cascading Style Sheet</h3>
      <p>FSCSS is a styling language that simplifies CSS with reusable components, variables, and powerful shorthand syntax, making styling more efficient and expressive</p>
      <div class="tags">
        <span class="var">Variables</span>
        <span class="reuse">Reusable Components</span>
        <span class="syn">Shorthand Syntax</span>
        <span class="sty">Dynamic Styling</span>
      </div>
